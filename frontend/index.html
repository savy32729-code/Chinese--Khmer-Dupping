<!DOCTYPE html>

<html lang="km">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Chinese → Khmer Dubbing
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">


    <!-- Header -->

    <div class="hero">

        <div class="flag">
            🇨🇳 → 🇰🇭
        </div>

        <h1>
            Chinese → Khmer
        </h1>

        <p>
            AI Video Dubbing
        </p>

    </div>


    <!-- Video -->

    <div class="card">

        <h2>
            🎬 ជ្រើសរើស Video
        </h2>


        <label
            class="upload-box"
            for="videoInput"
        >

            <div class="upload-icon">
                📁
            </div>

            <strong>
                ចុចដើម្បីជ្រើស Video
            </strong>

            <small>
                MP4, MOV, AVI និង Video ផ្សេងៗ
            </small>

        </label>


        <input
            type="file"
            id="videoInput"
            accept="video/*"
            hidden
        >


        <div
            id="videoInfo"
            class="video-info"
        >

            មិនទាន់បានជ្រើស Video

        </div>


        <div
            class="duration"
            id="duration"
        ></div>

    </div>


    <!-- Translation -->

    <div class="card">


        <div class="option-row">


            <div class="option-text">

                <span class="option-icon">
                    🌐
                </span>

                <div>

                    <strong>
                        បកប្រែជាភាសាខ្មែរ
                    </strong>

                    <small>
                        Chinese → Khmer
                    </small>

                </div>

            </div>


            <label class="switch">

                <input
                    type="checkbox"
                    id="translateToggle"
                    checked
                >

                <span class="slider"></span>

            </label>

        </div>


        <!-- Voice -->

        <div class="voice-group">

            <label for="voiceSelect">

                🎙️ សំឡេងខ្មែរ

            </label>


            <select id="voiceSelect">
    <option value="km-KH-PisethNeural">Piseth (ប្រុស)</option>
    <option value="km-KH-SreymomNeural">Sreymom (ស្រី)</option>
</select>

        </div>


        <!-- Start -->

        <button
            id="startBtn"
            class="primary-btn"
            disabled
        >

            🎙️

            ចាប់ផ្តើម Dubbing

        </button>

    </div>


    <!-- Progress -->

    <div
        id="progressCard"
        class="card hidden"
    >

        <h2>
            ⚙️ កំពុងដំណើរការ
        </h2>


        <div class="progress">

            <div
                id="progressFill"
                class="progress-fill"
            ></div>

        </div>


        <div
            id="percentage"
            class="percentage"
        >
            0%
        </div>


        <div
            id="progressText"
            class="progress-text"
        >
            កំពុងរៀបចំ...
        </div>


        <div
            id="processingStatus"
            class="processing-status"
        ></div>

    </div>


    <!-- Results -->

    <div
        id="resultsCard"
        class="card hidden"
    >

        <h2>
            ✅ Dubbing រួចរាល់
        </h2>


        <div
            id="partsList"
            class="parts-list"
        ></div>


        <a
            id="saveBtn"
            class="save-btn"
            target="_blank"
            rel="noopener"
        >

            🎬 មើល Video Khmer

        </a>

    </div>


</div>


<script src="script.js"></script>


</body>

</html>
