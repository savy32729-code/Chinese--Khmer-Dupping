<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>
        Chinese → Khmer Dubbing
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <main class="app">

        <!-- =========================================
             Header
        ========================================== -->

        <header class="header">

            <div class="logo">
                🎬
            </div>

            <div>
                <h1>
                    Chinese → Khmer
                </h1>

                <p>
                    Video Dubbing
                </p>
            </div>

        </header>


        <!-- =========================================
             Upload Card
        ========================================== -->

        <section class="card">

            <div class="card-title">

                <span>
                    📹
                </span>

                <div>
                    <h2>
                        ជ្រើសរើសវីដេអូ
                    </h2>

                    <p>
                        MP4, MOV, MKV, AVI, WEBM
                    </p>
                </div>

            </div>


            <label
                for="videoInput"
                class="upload-box"
            >

                <div class="upload-icon">
                    ⬆️
                </div>

                <strong>
                    ចុចទីនេះដើម្បីជ្រើសរើសវីដេអូ
                </strong>

                <span>
                    ឬ Drag & Drop វីដេអូមកទីនេះ
                </span>

            </label>


            <input
                type="file"
                id="videoInput"
                accept="video/mp4,video/quicktime,video/x-matroska,video/x-msvideo,video/webm,.mov,.mp4,.mkv,.avi,.webm"
                hidden
            >


            <!-- Video Info -->

            <div
                id="videoInfo"
                class="video-info"
            >
                មិនទាន់បានជ្រើសរើសវីដេអូ
            </div>

            <div
                id="duration"
                class="file-size"
            ></div>


            <!-- Translation Option -->

            <div class="option-row">

                <div class="option-text">

                    <span class="option-icon">
                        🌐
                    </span>

                    <div>

                        <strong>
                            បកប្រែជាភាសាខ្មែរ
                        </strong>

                        <small>
                            Chinese → Khmer
                        </small>

                    </div>

                </div>


                <label class="switch">

                    <input
                        type="checkbox"
                        id="translateToggle"
                        checked
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Start Button -->

            <button
                id="startBtn"
                class="primary-btn"
                disabled
            >

                <span>
                    🎙️
                </span>

                ចាប់ផ្តើម Dubbing

            </button>

        </section>


        <!-- =========================================
             Progress Card
        ========================================== -->

        <section
            id="progressCard"
            class="card progress-card"
            style="display:none;"
        >

            <div class="section-heading">

                <div>
                    <h2>
                        កំពុងដំណើរការ
                    </h2>

                    <p id="processingStatus">
                        កំពុងរៀបចំ...
                    </p>
                </div>

                <strong id="percentage">
                    0%
                </strong>

            </div>


            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill"
                    style="width:0%;"
                ></div>

            </div>


            <p
                id="progressText"
                class="progress-text"
            >
                កំពុងរៀបចំ...
            </p>

        </section>


        <!-- =========================================
             Results Card
        ========================================== -->

        <section
            id="resultsCard"
            class="card results-card"
            style="display:none;"
        >

            <div class="section-heading">

                <div>

                    <h2>
                        🎉 លទ្ធផល
                    </h2>

                    <p>
                        សំឡេង និងការបកប្រែ
                    </p>

                </div>

            </div>


            <div
                id="partsList"
                class="parts-list"
            ></div>


            <button
                id="saveBtn"
                class="secondary-btn"
            >

                💾
                រក្សាទុកអត្ថបទខ្មែរ

            </button>

        </section>


        <!-- =========================================
             Footer
        ========================================== -->

        <footer>

            <p>
                Chinese → Khmer Video Dubbing
            </p>

            <p class="footer-small">
                Powered by Whisper + Translation + TTS
            </p>

        </footer>

    </main>


    <!-- JavaScript -->

    <script
        src="script.js"
        defer
    ></script>

</body>

</html>
